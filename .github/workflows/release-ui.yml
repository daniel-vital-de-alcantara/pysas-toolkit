name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --check ui/keyboard.js
      - run: node --check ui/graph.js
      - run: node --test tests/test_ui.cjs tests/test_graph.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            PySAS Workbench preview.30: EGP extraction fixed to use program names and process flows, plus the new Workbench interface.

            Download the attached Python ZIP, extract fully and open START_PYSAS.bat.

            - Extract EGP programs using project labels and process flows, as in MagicRoot. Inspect/download the full output; repack edits from either source view with conflict detection.
            - Run single files or new/continued schedules; manage global controls in Settings.
            - Inspect named runs through Files, Logs and Tasks; download or copy original artifacts.
            - Pack/unpack source bundles with recent folders, verification, backups and accurate counts.
            - Refresh server libraries, tables and columns progressively, retaining inaccessible-member warnings.
            - Use bounded read-only previews and incremental dictionary search with CSV/Excel exports.
            - Includes standalone engine 0.3.15. SAS execution and scheduler behavior are retained.

            Automated checks include Windows fake-EG integration; live SAS-server and desktop visual acceptance of the new features remains pending.

            Read docs/egp-extraction.md, docs/next-version/release-notes.md and windows-eg-acceptance.md inside the ZIP for limits, compatibility and verification requirements.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
