name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            Repair scheduler execution using the actual user-supplied Rich-terminal PySAS 0.3.2.

            Download PySAS-Workbench-Python-0.4.0-preview.15.zip, extract fully and open START_PYSAS.bat.

            - One scheduler with 10 parallel tasks by default in the UI. Removed the incorrect original-engine selector.
            - Assign each submission to the original program's SAS server. Named sections now select the enclosed code; previous UI versions ignored section selection.
            - Prepend always-run sections/ranges before each target, in workbook order, in one SAS submission. Shared setup never runs as separate tasks.
            - Restore SAS stop-on-error options, propagation of setup error controls and each task's isolated working directory.
            - Display the running program's section/rows, shared setup and execution stage alongside elapsed time.
            - Treat log-save failure as failure. Keep per-file stops, stable clocks, bundle downloads, hidden startup consoles and the PySAS app icon.
            - CLI remains a standalone pysas.py (0.3.9); schedule --max-parallel remains accepted.

            Windows tests compare submitted code against the VBScript from the actual supplied 0.3.2, including three shared definitions and named sections, and test UI-to-worker completion. Only EG COM is substituted. Hosted CI has no licensed SAS server, so the user's real workload still requires verification. See docs/execution-investigation.md for the corrected reference and evidence.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
