name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            One complete log file for each schedule.

            Download PySAS-Workbench-Python-0.4.0-preview.17.zip, extract fully and open START_PYSAS.bat.

            - Every new schedule or continuation creates schedule.log when it completes or is stopped.
            - Includes available SAS logs and automation console output, grouped in workbook order, with task ID, program, section/rows, status and elapsed time.
            - Records skipped, blocked and cancelled tasks, including when no SAS log is available. Keeps individual logs intact.
            - Download schedule log is available on the schedule card and in Console. The file is also under Logs in the schedule inspector.
            - Handles large files and Windows/Unicode encodings. Downloads include the complete file even when the in-app preview is limited.
            - Standalone pysas.py is version 0.3.11; whole-schedule stop and skipped dependency handling remain included.

            The combined log is generated after completion or stop; it does not fetch live remote SAS logs. Tests cover grouping, multiple encodings, large downloads and stopped runs, including Windows UI-to-worker integration with a COM substitute.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
