name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            Portable saved data, historical runtime estimates and complete run-folder downloads.

            Download PySAS-Workbench-Python-0.4.0-preview.18.zip, extract fully and open START_PYSAS.bat.

            - Files & folders: export and restore saved-data ZIPs with all saved run outputs, command history, consoles, bundle downloads and settings. Existing runs are preserved; workspace paths are remapped. External input folders and queued jobs are not included.
            - Estimate time for individual files and schedules, using successful history for the same program and section/rows. Expected total durations also appear beside running tasks and queued watcher files.
            - Schedule estimates respect dependencies, skipped-row barriers and parallel limits. Incomplete history is shown as a lower bound such as ~5h+; no history is shown as unknown.
            - Inspect: download the entire run folder as a ZIP, including files beyond the preview limit.
            - The working standalone SAS execution engine remains unchanged at 0.3.11.

            First upgrade: close PySAS and copy the new app files into your existing workspace, keeping .pysas-ui, runs and runner/runs, then export a backup. Backups require an idle workbench and are limited to 10 GB expanded / 200,000 files. Restoring replaces folder settings and saved bundle paths, preserves existing runs, and starts no jobs. Estimates match names and selections; changed code, data and server load can affect actual duration.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
