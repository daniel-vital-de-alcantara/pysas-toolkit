name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --check ui/keyboard.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            More intuitive keyboard shortcuts and arrow-key list navigation.

            Download PySAS-Workbench-Python-0.4.0-preview.25.zip, extract fully and open START_PYSAS.bat.

            - Fixed navigation letters: Alt, then O Overview, R Runner, S Scheduler, B Bundles, H History, F Files, or V Servers. F10 also opens hints.
            - X shows commands for the current page. Common actions use mnemonic hints; lists get one entry hint instead of a letter on every row.
            - Alt H focuses run history directly. Up/Down browses items, Home/End jumps to the ends, Page Up/Down moves ten rows, and Enter opens the focused item.
            - Arrow navigation also works in task tables and Inspect's file list. Left/Right moves between row actions; Tab leaves the list. Text fields keep normal editing keys.
            - Esc closes Inspect and restores focus to the run. Automatic refresh preserves keyboard focus.
            - Includes the saved-data, clipboard, cleanup and consolidated continuation features from preview.24. Standalone execution engine remains 0.3.13.

            Automated tests cover fixed navigation, dialog scoping, collision-free hints, arrow navigation, focus, and unchanged execution behaviour. Close PySAS before upgrading and keep your saved data or use backup/restore.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
