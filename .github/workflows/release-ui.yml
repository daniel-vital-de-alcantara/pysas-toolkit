name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            Stop an entire schedule and preserve dependencies through skipped tasks.

            Download PySAS-Workbench-Python-0.4.0-preview.16.zip, extract fully and open START_PYSAS.bat.

            - Stop schedule is available on each active Scheduler/Continue card and inside its Console view. It prevents further submissions and cancels that schedule's active local automation processes, including files still starting.
            - Other schedules and watchers continue independently. Completed results are preserved, queued tasks become Cancelled, and the run is saved as Stopped with its elapsed time.
            - Skipped rows wait for their dependencies before releasing downstream tasks. For A -> B (skipped) -> C, C waits for A. Longer skipped chains, multiple parents, failed ancestors and continuation follow the same rule.
            - Skipped rows remain Pending in the UI until prerequisites complete, then change to Skipped without starting a SAS session.
            - Includes the working preview.15 submission behavior, one scheduler with 10 parallel tasks by default, section/row progress and shared setup.
            - Standalone pysas.py is version 0.3.10.

            Tests cover skipped dependency chains and failures, cancellation before startup, stopping queued/active tasks, and independent schedules. Windows integration exercises the UI, worker and real cscript with a COM substitute, including cancelling one schedule while another completes. Actual remote SAS cancellation depends on the EG/server connection; partial outputs may remain, as with Stop file.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
