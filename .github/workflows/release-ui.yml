name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            Scheduler programs now show their section and selected source rows in Running now, schedule activity and the inspector.

            Download PySAS-Workbench-Python-0.4.0-preview.12.zip, extract it fully and open START_PYSAS.bat.

            - Example: Realised.sas — Section Realised · Rows 20–85.
            - Open-ended ranges and whole-program runs are labelled explicitly.
            - This displays the range selected in the workbook, not SAS's current executing line.
            - Saved for new UI runs. Execution behavior and the standalone pysas.py engine remain unchanged from preview.11.
            - Includes the previous stability, encoding, per-file stop and bundle download fixes. Experimental live SAS log polling remains removed.

            Requires Windows, Python 3.10+, configured Enterprise Guide and openpyxl for Excel features.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
