name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            Copy logs and SAS code directly from Inspect.

            Download PySAS-Workbench-Python-0.4.0-preview.21.zip, extract fully and open START_PYSAS.bat.

            - New Copy button beside Download for log, SAS and other text files in Inspect.
            - Copies the entire file, including lines outside a truncated preview or log tail. UTF-8, UTF-16 and legacy Windows text decoding use the existing engine reader.
            - Copied confirms success. Clipboard permission failures display an error; nothing is automatically sent to Copilot or any other service.
            - Click Copy again to include newly written output. Excel/binary results remain downloadable.
            - Includes Servers snapshots and all previous features. The standalone SAS execution engine remains 0.3.12.

            Close PySAS before upgrading and keep your saved data or use backup/restore.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
