name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            Stability update for runs that remain active and uneven elapsed counters.

            Download PySAS-Workbench-Python-0.4.0-preview.11.zip and extract the entire ZIP. Stop old stuck runs before closing the old app, then launch START_PYSAS.bat from the new folder.

            - Removed the experimental PowerShell live-log polling mode. UI and CLI use the same standard VBScript execution bridge.
            - Completion no longer waits for output-pipe EOF from lingering child processes. Console output goes straight to disk and is readable while running.
            - Console stages distinguish SAS execution, saving results and closing Enterprise Guide. Full remote SAS logs are available after EG exports them; this release does not stream them during execution.
            - Monotonic elapsed counters do not reset on each status poll. Unchanged run lists are not redrawn. Slow folder/history scans run in the background without blocking live status.
            - Keeps per-file stops, original source recovery, encoding fixes, bundle downloads, taskbar identity and terminal-free startup.

            Windows, Python 3.10+, Enterprise Guide and openpyxl for Excel features are still required. Regression tests cover inherited-output-handle completion, slow-folder isolation, clocks and cancellation. Actual SAS execution must be verified in your environment.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
