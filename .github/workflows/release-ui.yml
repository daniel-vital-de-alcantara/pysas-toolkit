name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            Best-effort Servers refresh: retain readable metadata when tables or libraries are inaccessible.

            Download PySAS-Workbench-Python-0.4.0-preview.23.zip, extract fully and open START_PYSAS.bat.

            - Queries metadata separately for each library and table, skipping ordinary access failures and continuing with the next member.
            - Saves a Partial snapshot with skipped items and refresh warnings. Library totals show At least or Unknown when metadata is incomplete.
            - Retains complete records from incomplete exported logs and keeps readable results even when SAS reports errors. Original errors remain in Inspect and the refresh log.
            - Previous snapshots, saved-data backup/restore, and Copy file from Inspect remain available.
            - The standalone SAS execution engine remains 0.3.12.

            Tests cover failed members, partial logs, backup/restore, UI warnings, and the Windows runner with substituted EG COM. Actual SAS metadata collection still requires validation on your SAS server.
            Close PySAS before upgrading and keep your saved data or use backup/restore.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
