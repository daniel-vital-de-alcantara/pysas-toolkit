name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            Edit SAS parameters and reusable case lists directly in Run a file.

            Download PySAS-Workbench-Python-0.4.0-preview.19.zip, extract fully and open START_PYSAS.bat.

            - Enable Use parameters for this run, then type/paste SAS macro definitions or load a local .sas file into the editor.
            - Shared initialization runs first, then the current editor contents, then your program, in the same SAS submission. Unsaved edits are used by Run program.
            - Save named parameter files and load them again. Saved lists live separately from shared initialization and are included in saved-data backups.
            - Each launch freezes its own parameter snapshot. Inspect parameters/<filename>.sas in the run folder, including after success. Later edits cannot change an already launched job.
            - Standalone pysas.py 0.3.12 supports runner run --parameters cases.sas. Existing watcher, scheduler, dependency, shared-setup and Windows automation behavior is retained.

            Close PySAS before upgrading. Keep your .pysas-ui, runs and runner/runs data or use the saved-data backup/restore controls. Imported .sas files are copied into the editor, not moved; if an old case list is already in shared initialization, move the original out of that folder when you want it to apply only to selected runs.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
