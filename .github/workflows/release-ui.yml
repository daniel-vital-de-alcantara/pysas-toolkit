name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --check ui/keyboard.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            SAS log summaries in the run inspector.

            Download PySAS-Workbench-Python-0.4.0-preview.29.zip, extract fully and open START_PYSAS.bat.

            - Open any SAS .log or consolidated schedule.log to see error and warning counts across the whole saved file, including outside the normal preview.
            - First error and First warning show the issue with surrounding log lines.
            - Browse all issues, filter errors or warnings, and page through every match. Line numbers and keyboard navigation help you move quickly.
            - Latest log output returns to the usual preview. Download and Copy file still use the original complete log.
            - Changed logs are rescanned; stale issue context is never silently reused. Live summaries include only content already saved by Enterprise Guide.
            - The standalone SAS engine remains 0.3.14. Shared WORK, library discovery and previous features remain included.

            Automated tests cover full-file scanning, numbered diagnostics, source-echo exclusion, pagination, UTF-16/ANSI text, changed logs, HTTP access and safe rendering. Desktop visual verification was unavailable because the development Mac was locked.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
