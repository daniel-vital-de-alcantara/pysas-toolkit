name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            PySAS now opens in a dedicated Windows app-style window, without browser tabs or an address bar.

            **Download PySAS-Workbench-Python-0.4.0-preview.6.zip below**, extract the entire ZIP and double-click START_PYSAS.bat.

            - START_PYSAS.bat opens an Edge/Chrome app window with its own profile. START_PYSAS_BROWSER.bat keeps normal browser mode available.
            - Still a portable Python ZIP: requires Python plus installed Edge or Chrome. Keep the launcher running while jobs execute.
            - Always-run tasks execute after stop-on-error, blocked dependencies and worker exceptions; continuation reruns them unless explicitly skipped.
            - Watcher _*.sas files remain shared initialization and are never queued as jobs. Shared-folder and inbox init files are prepended alphabetically; --lib retains its override behavior.
            - Files & folders: configure project inputs, shared initialization and watcher inbox. Upload multiple files directly, with progress and no replacement of existing files.
            - Keep PC awake prevents idle sleep/display timeout on Windows without generating clicks. Does not override manual sleep/lid-close or managed lock policies.
            - Live filenames, elapsed time, saved history, bundle folder shortcuts and blue styling remain included.
            - pysas.py 0.3.4 remains a standalone single-file CLI. Default paths and existing commands still work; optional --inbox and --init-dir select custom folders.

            Upgrade by copying all application files, including pysas.py and ui_support.py, into your existing workspace. Keep your SAS/EGP/workbook files and .pysas-ui settings.

            Requires Windows, Python 3.10+, configured SAS Enterprise Guide, and openpyxl for Excel features. No Node.js is needed. Automated tests cover lifecycle/scheduling with fake SAS jobs; real Enterprise Guide execution must be tested in your environment.
          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
