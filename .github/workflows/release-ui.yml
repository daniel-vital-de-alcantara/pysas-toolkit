name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            Copy actual files from Inspect, like Copy in Windows Explorer.

            Download PySAS-Workbench-Python-0.4.0-preview.22.zip, extract fully and open START_PYSAS.bat.

            - Copy file beside Download now places the selected file on the Windows shell clipboard. This replaces preview.21's text-copy behavior.
            - Paste with Ctrl+V into apps that accept file attachments. Works for logs, SAS programs, Excel and other inspected files with their original filename and bytes.
            - Uses copy semantics, not cut/move. Keep the source file available until pasting. Attachment support depends on the destination application.
            - File copied confirms success; clipboard failures are reported. No upload is performed automatically. On macOS/Linux, use Download.
            - Includes all previous features; the standalone SAS execution engine remains 0.3.12.

            Windows tests verify that another process receives a real file-drop clipboard entry after the copying process exits, without text conversion or changes to the source file.
            Close PySAS before upgrading and keep your saved data or use backup/restore.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
