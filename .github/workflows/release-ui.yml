name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --check ui/keyboard.js
      - run: node --check ui/graph.js
      - run: node --test tests/test_ui.cjs tests/test_graph.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body_path: docs/next-version/release-notes.md
          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
