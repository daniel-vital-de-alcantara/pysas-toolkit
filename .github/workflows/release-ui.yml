name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            Browse SAS libraries and tables in the new Servers tab.

            Download PySAS-Workbench-Python-0.4.0-preview.20.zip, extract fully and open START_PYSAS.bat.

            - Choose an EGP connection and refresh an on-demand catalog through the existing runner. Shared initialization or an override assigns libraries first; optionally filter library names.
            - Browse library storage totals and searchable tables/views with sizes, reported row counts, column counts and creation/change dates. Sort by size/date and page through larger catalogs.
            - Metadata returns through the standard saved SAS log. No shared server folder or live COM polling is needed.
            - Keep older snapshots, reuse a connection, download catalog JSON, and carry snapshots with saved-data backup/restore. A failed refresh preserves earlier successful snapshots.
            - Missing metadata is shown as Unknown; partial library totals say At least. Storage is SAS-reported table disk space, not RAM or free server capacity. WORK, SASHELP and SASUSER are excluded.
            - The standalone engine remains 0.3.12. Scheduler, watcher and per-run parameter execution are unchanged.

            Windows automation is regression-tested using real cscript with substituted EG COM. Actual metadata availability depends on your SAS connection and library engines. Close PySAS before upgrading and keep your saved data or use backup/restore.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
