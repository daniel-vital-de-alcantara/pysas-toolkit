name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --check ui/keyboard.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            Keyboard controls, reliable saved-data exports, storage cleanup, and consolidated schedule continuation.

            Download PySAS-Workbench-Python-0.4.0-preview.24.zip, extract fully and open START_PYSAS.bat.

            - Tap Alt or F10 for letter hints on visible controls, including Inspect and confirmation dialogs. Esc cancels hints; Tab and Shift+Tab remain available.
            - Copy actual files beside bundle, schedule-log, metadata JSON and prepared ZIP downloads on Windows.
            - Background ZIP preparation with progress and nearby errors. Export all saved data or configs only, then Download or Copy file. Prepared ZIP caches last until app restart.
            - The Completed runs card reports saved storage. History provides reviewed cleanup of failed/stopped runs or all finished runs, protecting active and unknown runs.
            - Continue schedules in the same folder, retaining successful outputs and total active time, excluding pauses. Failed attempts are archived separately; the main log contains one current result per task and identifies multipart execution.
            - Standalone engine 0.3.13 uses the same continuation behaviour. Existing SAS execution and shared initialization workflows remain available.

            Regression tests cover repeated continuation, pause exclusion, log consolidation, Windows worker/EG bridge simulation, keyboard events, background exports, clipboard routing, and cleanup protections. A licensed SAS server is not available in CI.
            Close PySAS before upgrading and keep your saved data or use backup/restore.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
