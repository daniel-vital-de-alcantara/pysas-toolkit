name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            Execution investigation and original 0.3.2 scheduler comparison. The reported wait inside EG code.Run is not yet verified as resolved on a real SAS server.

            Download PySAS-Workbench-Python-0.4.0-preview.13.zip and extract fully. Open START_PYSAS.bat.

            - Scheduler offers Original 0.3.2 · terminal comparison: byte-identical published engine, original scheduler and EG bridge.
            - Use Maximum parallel tasks = 0 to honor workbook settings. The UI previously forced two workers.
            - Original 0.3.2 runs always_run rows as separate tasks; current mode prepends them to each program. Original mode has no per-file stop or live console capture.
            - Worker output/events no longer depend on the UI draining a pipe. History-write failures cannot strand worker completion.
            - Current console identifies prepended setup ranges and the saved submitted-code file.
            - Includes docs/execution-investigation.md with evidence, remaining differences and a controlled comparison procedure.

            Requires Windows, Python 3.10+, configured Enterprise Guide and openpyxl for Excel features. SAS-server execution is not covered by CI.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
