name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            Restore terminal execution behavior for UI-launched SAS jobs.

            Download PySAS-Workbench-Python-0.4.0-preview.14.zip, extract fully and open START_PYSAS.bat.

            - Scheduler now defaults to the exact original 0.3.2 engine. Preview.13 still defaulted to the modified engine unless selected manually.
            - SAS workers use a real Windows console kept hidden. cscript inherits that console and normal console input. Removed CREATE_NO_WINDOW from the SAS automation path.
            - Watcher stop controls use a separate file instead of occupying standard input.
            - Workbook concurrency remains the default. Current shared-setup behavior is an explicit alternative; original 0.3.2 retains its original limitations, including no per-file cancellation or live console capture.
            - Local command history records the actual engine, Python executable and console attachment.
            - Windows integration tests exercise hidden pythonw server -> UI launch -> worker -> real cscript, console inheritance and completed UI status. They substitute SAS COM because CI has no licensed SAS server.

            This removes confirmed engine-selection and launch discrepancies. The user's actual SAS workload still requires verification; server-side completion is not certified by CI. See docs/execution-investigation.md.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
