name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --check ui/keyboard.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            Shared WORK, remaining-time estimates, and easier library discovery.

            Download PySAS-Workbench-Python-0.4.0-preview.26.zip, extract fully and open START_PYSAS.bat.

            - Runner: paste the WORK path from an existing SAS session, enable shared WORK and save. Default library is VDI. PySAS assigns it and sets USER for new file runs, watchers, schedules and server refreshes.
            - Keep the owning SAS session open. All participating sessions must access the same server directory. Explicit WORK.table references remain local; one-level table names use VDI. Restart existing watchers after changing settings.
            - Running files shows estimated time remaining, accounting for dependencies, parallel workers, elapsed task time and the current watcher queue. Unknown or overdue timings remain clearly marked.
            - Servers automatically reuses a successful EGP connection or the only input EGP. With several unused connections, choose once. Discover libraries lists assignments without scanning tables; check libraries before refreshing table metadata.
            - Saved-data and configuration backups include shared WORK settings. Restored paths are disabled until re-enabled for a valid session.
            - Standalone engine 0.3.14 retains existing terminal workflows. Alt navigation, file clipboard, backups and consolidated schedule continuation remain included.

            Automated Python, JavaScript and Windows bridge checks run before publishing. Real SAS server execution requires verification in your environment; it is unavailable on the development Mac.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
