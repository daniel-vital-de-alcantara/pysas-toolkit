name: Test and release PySAS Workbench

on:
  push:
    branches: [main]
    tags: ['v0.4.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl
      - run: python -m unittest discover -s tests -v
      - run: node --check ui/app.js
      - run: node --test tests/test_ui.cjs
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          name: PySAS Workbench ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          fail_on_unmatched_files: true
          body: |
            Fixes garbled code previews and adds running-output inspection, individual file stops and bundle downloads.

            Download PySAS-Workbench-Python-0.4.0-preview.10.zip, extract the entire ZIP and open START_PYSAS.bat.

            - Windows-1252 text is no longer misread as UTF-16. New submitted-code exports use UTF-8.
            - Inspect refreshes automatically and shows the newest log output and last update time. Execution console output streams during runs.
            - Optional Live SAS log snapshots (PowerShell) queries EG directly without a shared server folder. Availability depends on what EG exposes while running; some versions buffer until completion. The standard VBScript mode remains available. No execution policy is changed.
            - Stop file targets only that file's automation process. CANCELLED tasks respect scheduler dependency/stop-on-error rules. Partial outputs may remain; local termination cannot confirm remote SAS cancellation.
            - Download bundle keeps a separate copy for every completed bundle command, including custom folders.
            - Includes the blue taskbar identity, automatic terminal closing, elapsed times, watcher initialization and scheduler shared setup from earlier previews.

            Requires Windows, Python 3.10+, configured Enterprise Guide and openpyxl for Excel features. Tests cover output streaming/cancellation and the PowerShell snapshot helper; real SAS execution and live-log availability require validation in your environment.

          files: |
            release/PySAS-Workbench-Python-*.zip
            release/SHA256SUMS.txt
